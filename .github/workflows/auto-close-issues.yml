name: Auto Close Labeled Issues

# Automatically closes issues labeled "completed" or "wontfix".
# Triggers:
#   - label: runs instantly whenever a label is added to an issue
#   - schedule: sweeps the whole repo every hour to catch anything missed
#   - workflow_dispatch: lets you trigger a manual sweep from the Actions tab
on:
  issues:
    types: [labeled]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  close-labeled-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Close issue if newly labeled completed/wontfix
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const targetLabels = ["completed", "wontfix"];
            const issue = context.payload.issue;
            const labelName = context.payload.label?.name;

            if (!targetLabels.includes(labelName)) {
              console.log(`Label "${labelName}" is not a close-trigger label. Skipping.`);
              return;
            }

            if (issue.state === "closed") {
              console.log(`Issue #${issue.number} is already closed.`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Closing this issue automatically because it was labeled \`${labelName}\`.`,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: "closed",
            });

            console.log(`Closed issue #${issue.number} (label: ${labelName}).`);

      - name: Sweep all open issues for target labels
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const targetLabels = ["completed", "wontfix"];

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: targetLabels.join(","),
              per_page: 100,
            });

            console.log(`Found ${issues.length} open issue(s) matching target labels.`);

            for (const issue of issues) {
              if (issue.pull_request) continue; // skip PRs

              const matched = issue.labels
                .map((l) => (typeof l === "string" ? l : l.name))
                .filter((name) => targetLabels.includes(name));

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Closing this issue automatically because it is labeled \`${matched.join("`, `")}\`.`,
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });

              console.log(`Closed issue #${issue.number} (labels: ${matched.join(", ")}).`);
            }
